name: V13 Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [v13-hybrid-migration]

jobs:
  backend-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Run regression suite
        shell: pwsh
        run: python -m pytest -q

      - name: Check hybrid JavaScript syntax
        shell: pwsh
        working-directory: .
        run: |
          node --check assets/js/bootstrap.js
          node --check assets/js/hybrid/python-bridge.js
          node --check assets/js/hybrid/regression.js
          node --check assets/js/hybrid/engine-source.js
          node --check assets/js/hybrid/authoritative-engine.js
          node --check assets/js/hybrid/dual-write.js
          node --check assets/js/hybrid/storage-migration.js
          node --check assets/js/hybrid/document-export.js
