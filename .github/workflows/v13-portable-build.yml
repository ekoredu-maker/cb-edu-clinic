name: V13 Portable Build

on:
  workflow_dispatch:
  push:
    branches: [main, v13-hybrid-migration, v13-gui-runtime-hotfix]
    paths:
      - 'backend/**'
      - 'assets/**'
      - 'icons/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'packaging/**'
      - '.github/workflows/v13-portable-build.yml'

jobs:
  build-windows-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-build.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install -r backend/requirements-build.txt

      - name: Run regression tests
        shell: pwsh
        working-directory: backend
        run: python -m pytest -q

      - name: Check hybrid JavaScript syntax
        shell: pwsh
        run: |
          node --check assets/js/bootstrap.js
          node --check assets/js/hybrid/python-bridge.js
          node --check assets/js/hybrid/regression.js
          node --check assets/js/hybrid/engine-source.js
          node --check assets/js/hybrid/authoritative-engine.js
          node --check assets/js/hybrid/dual-write.js
          node --check assets/js/hybrid/storage-migration.js
          node --check assets/js/hybrid/read-source.js
          node --check assets/js/hybrid/document-export.js
          node --check assets/js/hybrid/statistics-report-export.js

      - name: Prepare complete offline frontend
        shell: pwsh
        run: |
          python packaging/prepare_offline_bundle.py
          if (!(Test-Path '.build/offline_frontend/assets/vendor/chart.umd.js')) { throw 'offline Chart.js missing' }
          if (!(Test-Path '.build/offline_frontend/assets/vendor/xlsx.full.min.js')) { throw 'offline SheetJS missing' }
          if (!(Test-Path '.build/offline_frontend/assets/vendor/exceljs.min.js')) { throw 'offline ExcelJS missing' }
          $idx = Get-Content -Raw -Encoding UTF8 '.build/offline_frontend/index.html'
          if ($idx -match 'https?://(cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com|unpkg\.com|fonts\.googleapis\.com|fonts\.gstatic\.com)') { throw 'external CDN reference remains in offline index' }
          $report = Get-Content -Raw -Encoding UTF8 '.build/offline_frontend/assets/js/hybrid/statistics-report-export.js'
          if ($report -match 'https?://') { throw 'external Excel report dependency remains in offline exporter' }
          if ($report -notmatch 'assets/vendor/exceljs\.min\.js') { throw 'local ExcelJS reference missing in offline exporter' }

      - name: Build portable one-folder package
        shell: pwsh
        run: |
          $env:CB_CLINIC_FRONTEND_ROOT = (Resolve-Path '.build/offline_frontend').Path
          python -m PyInstaller --noconfirm packaging/clinic_v13.spec
          New-Item -ItemType File -Force 'dist/학습클리닉_V13/portable.flag' | Out-Null
          New-Item -ItemType Directory -Force 'dist/학습클리닉_V13/data' | Out-Null
          @'
          충북종합학습클리닉 업무관리 프로그램 V13.0.1
          실행: 학습클리닉_V13.exe
          Python 별도 설치 불필요
          Microsoft Edge(Windows 기본) 또는 Google Chrome 필요
          주소창/탭 없는 앱 창으로 실행됨
          인터넷 연결 없이 핵심 UI/차트/행정보고형 엑셀/HWPX 기능 사용 가능
          Chart.js / SheetJS / ExcelJS는 프로그램 내부 로컬 자산 사용
          data 폴더는 실제 업무데이터이므로 업데이트 시 보존하세요.
          오류 발생 시 data 폴더의 *-error.log 파일을 함께 확인하세요.
          '@ | Set-Content -Path 'dist/학습클리닉_V13/사용안내.txt' -Encoding UTF8

      - name: Verify package structure and offline assets
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/학습클리닉_V13/학습클리닉_V13.exe')) { throw 'EXE missing' }
          if (!(Test-Path 'dist/학습클리닉_V13/_internal/index.html')) { throw 'index.html missing' }
          if (!(Test-Path 'dist/학습클리닉_V13/_internal/assets/js/bootstrap.js')) { throw 'frontend assets missing' }
          if (!(Test-Path 'dist/학습클리닉_V13/_internal/assets/js/hybrid/statistics-report-export.js')) { throw 'statistics report exporter missing' }
          if (!(Test-Path 'dist/학습클리닉_V13/_internal/assets/vendor/chart.umd.js')) { throw 'packaged Chart.js missing' }
          if (!(Test-Path 'dist/학습클리닉_V13/_internal/assets/vendor/xlsx.full.min.js')) { throw 'packaged SheetJS missing' }
          if (!(Test-Path 'dist/학습클리닉_V13/_internal/assets/vendor/exceljs.min.js')) { throw 'packaged ExcelJS missing' }
          if (!(Test-Path 'dist/학습클리닉_V13/_internal/assets/vendor/versions.json')) { throw 'vendor version metadata missing' }
          if (!(Test-Path 'dist/학습클리닉_V13/portable.flag')) { throw 'portable.flag missing' }
          $idx = Get-Content -Raw -Encoding UTF8 'dist/학습클리닉_V13/_internal/index.html'
          if ($idx -match 'https?://(cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com|unpkg\.com|fonts\.googleapis\.com|fonts\.gstatic\.com)') { throw 'external CDN reference remains in packaged index' }
          if ($idx -notmatch 'assets/vendor/chart\.umd\.js') { throw 'local Chart.js reference missing' }
          if ($idx -notmatch 'assets/vendor/xlsx\.full\.min\.js') { throw 'local SheetJS reference missing' }
          $report = Get-Content -Raw -Encoding UTF8 'dist/학습클리닉_V13/_internal/assets/js/hybrid/statistics-report-export.js'
          if ($report -notmatch 'assets/vendor/exceljs\.min\.js') { throw 'packaged report exporter is not using local ExcelJS' }

          $forbidden = Get-ChildItem -Recurse -File 'dist/학습클리닉_V13' | Where-Object {
            $_.Name -ieq 'Python.Runtime.dll' -or $_.FullName -match '(pythonnet|clr_loader|\\clr\\)'
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Host $_.FullName }
            throw 'pywebview/pythonnet CLR runtime must not be packaged'
          }

      - name: Smoke-test packaged EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'dist/학습클리닉_V13/학습클리닉_V13.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Host '=== packaged self-test diagnostics ==='
            Get-ChildItem -Path 'dist/학습클리닉_V13/data' -Filter '*-error.log' -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "--- $($_.Name) ---"
              Get-Content -Raw -Encoding UTF8 $_.FullName
            }
            throw "Packaged EXE self-test failed: exit $($p.ExitCode)"
          }
          if (!(Test-Path 'dist/학습클리닉_V13/data/clinic_v13.db')) { throw 'portable SQLite database was not created' }

          $r = Start-Process -FilePath 'dist/학습클리닉_V13/학습클리닉_V13.exe' -ArgumentList '--runtime-self-test' -Wait -PassThru
          if ($r.ExitCode -ne 0) {
            Write-Host '=== packaged GUI runtime diagnostics ==='
            Get-ChildItem -Path 'dist/학습클리닉_V13/data' -Filter '*-error.log' -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "--- $($_.Name) ---"
              Get-Content -Raw -Encoding UTF8 $_.FullName
            }
            throw "Packaged GUI runtime self-test failed: exit $($r.ExitCode)"
          }

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: 학습클리닉_V13_Windows_Portable_Offline
          path: dist/학습클리닉_V13
          if-no-files-found: error
          retention-days: 14
