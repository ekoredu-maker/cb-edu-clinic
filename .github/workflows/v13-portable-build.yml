name: V13 School Portable Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'assets/**'
      - 'icons/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'packaging/**'
      - '.github/workflows/v13-portable-build.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'assets/**'
      - 'icons/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'packaging/**'
      - '.github/workflows/v13-portable-build.yml'

jobs:
  build-school-portable:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r backend/requirements-dev.txt

      - name: Run regression tests
        shell: pwsh
        working-directory: backend
        run: python -m pytest -q

      - name: Run operational UAT
        shell: pwsh
        working-directory: backend
        run: python uat_runner.py --output-dir ../.build/uat-school-portable

      - name: Check hybrid JavaScript syntax
        shell: pwsh
        run: |
          node --check assets/js/bootstrap.js
          node --check assets/js/hybrid/python-bridge.js
          node --check assets/js/hybrid/regression.js
          node --check assets/js/hybrid/engine-source.js
          node --check assets/js/hybrid/authoritative-engine.js
          node --check assets/js/hybrid/dual-write.js
          node --check assets/js/hybrid/storage-migration.js
          node --check assets/js/hybrid/read-source.js
          node --check assets/js/hybrid/realtime-import.js
          node --check assets/js/hybrid/document-export.js

      - name: Prepare complete offline frontend
        shell: pwsh
        run: |
          python packaging/prepare_offline_bundle.py
          if (!(Test-Path '.build/offline_frontend/assets/vendor/chart.umd.js')) { throw 'offline Chart.js missing' }
          if (!(Test-Path '.build/offline_frontend/assets/vendor/xlsx.full.min.js')) { throw 'offline SheetJS missing' }
          if (!(Test-Path '.build/offline_frontend/assets/js/hybrid/realtime-import.js')) { throw 'V14 realtime importer missing' }
          $idx = Get-Content -Raw -Encoding UTF8 '.build/offline_frontend/index.html'
          if ($idx -match 'https?://(cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com|unpkg\.com|fonts\.googleapis\.com|fonts\.gstatic\.com)') { throw 'external CDN reference remains in offline index' }

      - name: Build school distribution with official Python Embedded runtime
        shell: pwsh
        run: |
          ./packaging/build_embedded_portable.ps1 -Clean:$false
          if (!(Test-Path 'dist/학습클리닉_V13_Windows_Portable_Embedded.zip')) { throw 'School portable ZIP missing' }

      - name: Verify school portable ZIP contents
        shell: pwsh
        run: |
          $stage = '.build/embedded_portable/학습클리닉_V13_Embedded'
          if (!(Test-Path "$stage/실행.cmd")) { throw '실행.cmd missing' }
          if (!(Test-Path "$stage/실행_진단.cmd")) { throw 'diagnostic launcher missing' }
          if (!(Test-Path "$stage/runtime/python.exe")) { throw 'official embedded python.exe missing' }
          if (!(Test-Path "$stage/backend/domain/realtime_projection.py")) { throw 'realtime projection missing' }
          if (!(Test-Path "$stage/assets/js/hybrid/realtime-import.js")) { throw 'V14 importer missing' }
          if (!(Test-Path "$stage/data/데이터폴더_보존.txt")) { throw 'data preservation notice missing' }

      - name: Create manifest and SHA256
        shell: pwsh
        run: |
          $sha = '${{ github.sha }}'
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          @"
          product=CB Edu Clinic V13 Hybrid
          distribution=school-portable
          launcher=cmd-browser-localhost
          runtime=official-python-embedded
          custom_exe_distribution=false
          python_required_on_user_pc=false
          v14_handoff=true
          commit=$sha
          built_at_utc=$stamp
          package=dist/학습클리닉_V13_Windows_Portable_Embedded.zip
          "@ | Set-Content -Path 'dist/BUILD_MANIFEST.txt' -Encoding UTF8

          Get-FileHash 'dist/학습클리닉_V13_Windows_Portable_Embedded.zip' -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  학습클리닉_V13_Windows_Portable_Embedded.zip" } |
            Set-Content -Path 'dist/SHA256SUMS.txt' -Encoding ASCII

      - name: Upload school portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: 학습클리닉_V13_학교배포용_Portable
          path: |
            dist/학습클리닉_V13_Windows_Portable_Embedded.zip
            dist/BUILD_MANIFEST.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable UAT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 학습클리닉_V13_학교배포용_UAT
          path: .build/uat-school-portable
          if-no-files-found: warn
          retention-days: 30
