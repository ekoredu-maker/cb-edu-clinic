name: V14 Browser Smoke

on:
  pull_request:
    paths:
      - 'realtime-app/**'
      - '.github/workflows/v14-browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'realtime-app/**'
      - '.github/workflows/v14-browser-smoke.yml'
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/clinic-http.log 2>&1 &
          echo $! > /tmp/clinic-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/realtime-app/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/clinic-http.log
          exit 1

      - name: Run desktop and mobile browser smoke
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          async function check(browser, name, viewport) {
            const context = await browser.newContext({ viewport });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', err => pageErrors.push(String(err)));
            page.on('console', msg => {
              if (msg.type() === 'error') console.log('[console:error]', msg.text());
            });

            const response = await page.goto(
              'http://127.0.0.1:4173/realtime-app/?smoke=1',
              { waitUntil: 'domcontentloaded', timeout: 30000 }
            );

            if (!response || !response.ok()) {
              throw new Error(name + ': page HTTP response failed');
            }

            await page.waitForSelector('.login', { timeout: 15000 });
            await page.waitForSelector('#login-email', { timeout: 5000 });
            await page.waitForSelector('#login-password', { timeout: 5000 });

            const appText = (await page.locator('#app').innerText()).trim();
            if (!appText.includes('학습지원단 실시간 운영') || !appText.includes('로그인')) {
              throw new Error(name + ': login UI was not rendered');
            }

            const childCount = await page.locator('#app').evaluate(el => el.childElementCount);
            if (childCount < 1) {
              throw new Error(name + ': #app is empty');
            }

            await page.screenshot({
              path: '/tmp/v14-smoke-' + name + '.png',
              fullPage: true
            });

            if (pageErrors.length) {
              throw new Error(name + ': page errors: ' + pageErrors.join(' | '));
            }

            await context.close();
          }

          async function checkMobileId(browser, name, viewport) {
            const context = await browser.newContext({ viewport, serviceWorkers: 'block' });
            await context.addInitScript(() => {
              window.APP_CONFIG = { demoMode: true };
              localStorage.setItem('clinic-demo-role', 'supporter');
            });
            const page = await context.newPage();
            await page.route('https://cdn.jsdelivr.net/**', route => route.fulfill({
              status: 200,
              contentType: 'application/javascript',
              body: 'window.supabase = window.supabase || {};'
            }));
            const pageErrors = [];
            page.on('pageerror', err => pageErrors.push(String(err)));

            const response = await page.goto(
              'http://127.0.0.1:4173/realtime-app/?mobile-id-smoke=1',
              { waitUntil: 'domcontentloaded', timeout: 30000 }
            );
            if (!response || !response.ok()) {
              throw new Error(name + ': demo page HTTP response failed');
            }

            const myButton = page.getByRole('button', { name: /내정보/ });
            await myButton.waitFor({ state: 'visible', timeout: 10000 });
            await myButton.click();

            await page.getByText('학습지원단 모바일 신분증', { exact: true }).waitFor({ state: 'visible', timeout: 5000 });
            await page.getByText('JCEC-LS-DEMO-0001', { exact: true }).waitFor({ state: 'visible', timeout: 5000 });
            await page.getByText('법정 신분증이 아닙니다.', { exact: false }).waitFor({ state: 'visible', timeout: 5000 });

            const png = Buffer.from(
              'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z3xkAAAAASUVORK5CYII=',
              'base64'
            );
            const photoInput = page.locator('#id-photo-input');
            await photoInput.setInputFiles({
              name: 'profile.png',
              mimeType: 'image/png',
              buffer: png
            });
            await page.locator('.id-avatar.photo img').waitFor({ state: 'visible', timeout: 5000 });
            await page.getByText('사진 교체', { exact: true }).waitFor({ state: 'visible', timeout: 5000 });

            await page.screenshot({
              path: '/tmp/v14-mobile-id-' + name + '.png',
              fullPage: true
            });

            if (pageErrors.length) {
              throw new Error(name + ': mobile ID page errors: ' + pageErrors.join(' | '));
            }

            await context.close();
          }

          async function checkInviteFlow(browser, name, viewport) {
            const context = await browser.newContext({ viewport, serviceWorkers: 'block' });
            await context.addInitScript(() => {
              window.APP_CONFIG = { demoMode: true };
              localStorage.setItem('clinic-demo-role', 'admin');
            });
            const page = await context.newPage();
            await page.route('https://cdn.jsdelivr.net/**', route => route.fulfill({
              status: 200,
              contentType: 'application/javascript',
              body: 'window.supabase = window.supabase || {};'
            }));
            const pageErrors = [];
            page.on('pageerror', err => pageErrors.push(String(err)));

            let response = await page.goto(
              'http://127.0.0.1:4173/realtime-app/?invite-admin-smoke=1',
              { waitUntil: 'domcontentloaded', timeout: 30000 }
            );
            if (!response || !response.ok()) {
              throw new Error(name + ': invite admin page HTTP response failed');
            }

            const inviteButton = page.getByRole('button', { name: '학습지원단 초대' });
            await inviteButton.waitFor({ state: 'visible', timeout: 10000 });
            await inviteButton.click();

            await page.getByText('학습지원단 초대', { exact: true }).waitFor({ state: 'visible', timeout: 5000 });
            await page.locator('#invite-name').fill('김초대');
            await page.locator('#invite-email').fill('invite@example.kr');
            await page.getByRole('button', { name: '초대 생성' }).click();

            await page.getByText('방금 생성한 초대', { exact: true }).waitFor({ state: 'visible', timeout: 5000 });
            await page.getByText('482731', { exact: true }).waitFor({ state: 'visible', timeout: 5000 });
            await page.getByRole('button', { name: '카카오톡 안내문 복사' }).waitFor({ state: 'visible', timeout: 5000 });

            await page.screenshot({
              path: '/tmp/v14-invite-admin-' + name + '.png',
              fullPage: true
            });

            const token='0123456789abcdef0123456789abcdef0123456789abcdef';
            response = await page.goto(
              'http://127.0.0.1:4173/realtime-app/?invite=' + token,
              { waitUntil: 'domcontentloaded', timeout: 30000 }
            );
            if (!response || !response.ok()) {
              throw new Error(name + ': invite registration page HTTP response failed');
            }

            await page.getByText('학습지원단 등록', { exact: true }).waitFor({ state: 'visible', timeout: 5000 });
            await page.getByText('승인번호는 카카오톡 초대문에 포함되지 않습니다.', { exact: false }).waitFor({ state: 'visible', timeout: 5000 });
            await page.locator('#invite-code').fill('482731');
            await page.locator('#invite-password').fill('TestPassword!23');
            await page.locator('#invite-password2').fill('TestPassword!23');
            await page.getByRole('button', { name: '등록 완료' }).click();
            await page.getByText('등록 화면 검증이 완료되었습니다. (데모)', { exact: true }).waitFor({ state: 'visible', timeout: 5000 });

            await page.screenshot({
              path: '/tmp/v14-invite-register-' + name + '.png',
              fullPage: true
            });

            if (pageErrors.length) {
              throw new Error(name + ': invite flow page errors: ' + pageErrors.join(' | '));
            }

            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              await check(browser, 'desktop', { width: 1440, height: 900 });
              await check(browser, 'mobile', { width: 390, height: 844 });
              await checkMobileId(browser, 'desktop', { width: 1440, height: 900 });
              await checkMobileId(browser, 'mobile', { width: 390, height: 844 });
              await checkInviteFlow(browser, 'desktop', { width: 1440, height: 900 });
              await checkInviteFlow(browser, 'mobile', { width: 390, height: 844 });
              console.log('V14 login, mobile ID, photo, and Kakao invite smoke passed on desktop and mobile.');
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v14-browser-smoke
          path: |
            /tmp/v14-smoke-*.png
            /tmp/v14-mobile-id-*.png
            /tmp/v14-invite-admin-*.png
            /tmp/v14-invite-register-*.png
          if-no-files-found: ignore
